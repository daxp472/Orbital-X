[package]
name = "orbital-x"
version = "2.2.1"
description = "Orbital X AI-powered Desktop Coding IDE"
authors = ["Orbital X Team"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "orbital_x_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.4", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
chrono = { version = "0.4", features = ["serde"] }
similar = { version = "2.6", features = ["inline"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
walkdir = "2.5"
regex = "1.11"
dirs = "5.0"
